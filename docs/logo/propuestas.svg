<text x="40" y="88" font-family="'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6B6B8A">Colores de la app: violeta #6C63FF y turquesa #03DAC6. Abajo de cada una: como se ve chico (ícono del celular) y con el nombre.</text>
